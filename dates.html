<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find the Special Date ☁️</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

</head>

<body class="dates-page">

    <div class="background-glow"></div>

    <main class="dates-container">

        <p class="small-intro">
            Somewhere inside October...
        </p>

        <h1>
            Find the Special Day
        </h1>

        <p class="date-description">
            Every little cloud hides a date.
            <br>
            Find the one that holds the magic. ☁️
        </p>

        <!-- October heading -->
        <div class="month-title">
            October
        </div>

        <!-- Date clouds -->
        <div class="cloud-calendar">

            <button onclick="checkDate(1)">1</button>
            <button onclick="checkDate(2)">2</button>
            <button onclick="checkDate(3)">3</button>
            <button onclick="checkDate(4)">4</button>
            <button onclick="checkDate(5)">5</button>
            <button onclick="checkDate(6)">6</button>
            <button onclick="checkDate(7)">7</button>
            <button onclick="checkDate(8)">8</button>
            <button onclick="checkDate(9)">9</button>
            <button onclick="checkDate(10)">10</button>
            <button onclick="checkDate(11)">11</button>
            <button onclick="checkDate(12)">12</button>
            <button onclick="checkDate(13)">13</button>
            <button onclick="checkDate(14)">14</button>
            <button onclick="checkDate(15)">15</button>
            <button onclick="checkDate(16)">16</button>
            <button onclick="checkDate(17)">17</button>
            <button onclick="checkDate(18)">18</button>
            <button onclick="checkDate(19)">19</button>
            <button onclick="checkDate(20)">20</button>
            <button onclick="checkDate(21)">21</button>
            <button onclick="checkDate(22)">22</button>
            <button onclick="checkDate(23)">23</button>
            <button onclick="checkDate(24)">24</button>
            <button onclick="checkDate(25)">25</button>
            <button onclick="checkDate(26)">26</button>
            <button onclick="checkDate(27)">27</button>
            <button onclick="checkDate(28)">28</button>
            <button onclick="checkDate(29)">29</button>
            <button onclick="checkDate(30)">30</button>
            <button onclick="checkDate(31)">31</button>

        </div>

        <!-- Result message -->
        <div id="date-result"></div>

    </main>

    <script src="script.js"></script>

</body>

</html>
